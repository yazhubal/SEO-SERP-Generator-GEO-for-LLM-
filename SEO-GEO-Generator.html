                    "Cytuj wiarygodne źródła lub statystyki, gdy to możliwe, aby zwiększyć autorytet."
                ],
                meta_task: "Wygeneruj 3 warianty Tytułów Stron (maksymalnie 60 znaków) i Opisów Meta (maksymalnie 155 znaków). Niech będą chwytliwe, bogate w słowa kluczowe i dokładne.",
                serp_task: "Napisz akapit o długości 40-50 słów, zaprojektowany specjalnie w celu zdobycia Wyróżnionego Fragmentu (Pozycja Zero) dla głównego słowa kluczowego.",
                schema_task: "Podaj ważny kod JSON-LD dla schematu 'Article' lub 'FAQPage' odpowiedniego dla tego tematu.",
                code_export: "Umieść metadane, tekst SERP i źródła w osobnych, gotowych do skopiowania blokach kodu ```text; umieść JSON-LD w bloku kodu ```json. Przed każdym elementem dodaj krótką etykietę zapisaną zwykłym tekstem. Nie umieszczaj artykułu blogowego w bloku kodu. Wyświetl artykuł bezpośrednio jako renderowany Markdown: z wyraźnym tytułem H1, opisowymi nagłówkami H2/H3, krótkimi i czytelnymi akapitami oraz listami punktowanymi Markdown tylko wtedy, gdy poprawiają czytelność. Stosuj pełne, wyważone akapity odpowiednie do układu tekstu wyjustowanego. Nie używaj w artykule HTML, tabel, pogrubienia, kursywy ani formatowanych linków. Źródła podaj jako bezpośrednie adresy URL. Nie dodawaj wyjaśnień poza wymaganymi elementami."
            }
        };

        const App = () => {
            const [outputLang, setOutputLang] = useState('en');
            const [selectedFramework, setSelectedFramework] = useState('AIDA');
            const [inputs, setInputs] = useState({
                topic: '',
                keywords: '',
                audience: '',
                competitors: '',
                tone: 'Professional, Authoritative, yet Accessible',
                enableGEO: true,
                enableSchema: false,
                enableMeta: true,
                enableSerp: true,
                enableBlog: true // New State
            });
            const [generatedPrompt, setGeneratedPrompt] = useState('');
            const [copySuccess, setCopySuccess] = useState(false);
            const [theme, setTheme] = useState('day'); // 'day' or 'night'

            // toggle dark class on <html>
            useEffect(() => {
                if (theme === 'night') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [theme]);

            // Update Prompt whenever inputs or language change
            useEffect(() => {
                buildPrompt();
            }, [inputs, outputLang, selectedFramework]);

            const handleInputChange = (e) => {
                const { name, value, type, checked } = e.target;
                setInputs(prev => ({
                    ...prev,
                    [name]: type === 'checkbox' ? checked : value
                }));
            };

            const buildPrompt = () => {
                const { topic, keywords, audience, competitors, tone, enableGEO, enableSchema, enableMeta, enableSerp, enableBlog } = inputs;
                const tmpl = PROMPT_TEMPLATES[outputLang];
                
                // Use English placeholder if empty, but user inputs are preserved
                const _topic = topic || "[TOPIC]";
                const _keywords = keywords || "[KEYWORDS]";
                
                let promptParts = [];

                // 1. Role & Core Task (Translated)
                promptParts.push(`### ROLE\n${tmpl.role}\n${tmpl.lang_instruction}\n`);

                // 2. Context / Data Inputs
                promptParts.push(`### CONTEXT\n${tmpl.context}`);
                promptParts.push(`- ${tmpl.lbl_topic}: ${_topic}`);
                if (keywords) promptParts.push(`- ${tmpl.lbl_keywords}: ${_keywords}`);
                if (audience) promptParts.push(`- ${tmpl.audience_instruction} ${audience}`);
                if (competitors) promptParts.push(`- ${tmpl.lbl_competitors}: ${competitors}`);
                if (tone) promptParts.push(`- ${tmpl.tone_instruction} ${tone}`);
                
                // 3. GEO Specifics
                if (enableGEO) {
                    promptParts.push(`\n### GEO (GENERATIVE ENGINE OPTIMIZATION) STRATEGY\n${tmpl.geo_instruction}`);
                    (tmpl.geo_bullets || []).forEach((bullet) => promptParts.push(`- ${bullet}`));
                }

                // Research and source verification apply to every factual deliverable
                promptParts.push(`\n### SOURCE VERIFICATION\n${tmpl.blog_research}`);
                promptParts.push(`- ${tmpl.blog_citations}`);
                promptParts.push(`\n### PRODUCT COMPLIANCE CLAIMS\n${tmpl.product_compliance}`);

                // 4. Output Requirements
                promptParts.push(`\n### TASK & OUTPUTS`);
                
                let stepCounter = 1;

                if (enableMeta) {
                    promptParts.push(`${stepCounter}. **Meta Data**: ${tmpl.meta_task}`);
                    stepCounter++;
                }
                
                if (enableSerp) {
                    promptParts.push(`${stepCounter}. **SERP Snippet Optimization**: ${tmpl.serp_task}`);
                    stepCounter++;
                }

                if (enableSchema) {
                    promptParts.push(`${stepCounter}. **Schema Markup**: ${tmpl.schema_task}`);
                    stepCounter++;
                }

                // 5. Blog Post Section (If checked)
                if (enableBlog) {
                    promptParts.push(`\n### ${tmpl.blog_header}`);
                    promptParts.push(tmpl.blog_task);
                    promptParts.push(`**Constraints & Formatting:**`);
                    promptParts.push(`- ${tmpl.blog_length}`);
                    promptParts.push(`- ${tmpl.blog_structure}`);
                    promptParts.push(`- ${tmpl.frameworks[selectedFramework].instruction}`);
                    promptParts.push(`- ${tmpl.blog_seo}`);
                    promptParts.push(`- ${tmpl.tone_instruction} ${tone}`);
                    promptParts.push(`- ${tmpl.blog_goal}`);
                }

                // 6. Final Formatting
                promptParts.push(`\n${tmpl.format}`);
                promptParts.push(`- ${tmpl.code_export}`);
                if(outputLang !== 'en') promptParts.push(`- ${tmpl.lang_instruction}`);

                setGeneratedPrompt(promptParts.join('\n'));
            };

            const copyToClipboard = () => {
                const textArea = document.createElement("textarea");
                textArea.value = generatedPrompt;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                setCopySuccess(true);
                setTimeout(() => setCopySuccess(false), 2000);
            };

            const currentFramework = PROMPT_TEMPLATES[outputLang].frameworks[selectedFramework];

            return (
                <div className="min-h-screen p-3 md:p-5 flex flex-col items-center justify-center relative bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
                    
                    {/* theme switch button */}
                    <button
                        onClick={() => setTheme(theme === 'day' ? 'night' : 'day')}
                        aria-label="Toggle theme"
                        className="absolute top-3 right-3 w-8 h-8 flex items-center justify-center rounded-full bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 shadow hover:scale-105 transition text-sm">
                        <i className={`fa-solid ${theme === 'day' ? 'fa-sun' : 'fa-moon'}`}></i>
                    </button>

                    <div className="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
                        
                        {/* LEFT COLUMN - INPUTS */}
                        <div className="glass-panel rounded-xl shadow-lg p-4 md:p-5 animate-fade-in flex flex-col gap-3.5">
                            <div className="border-b border-gray-200 dark:border-gray-700 pb-2.5">
                                <h1 className="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                                    <i className="fa-solid fa-layer-group text-blue-600"></i>
                                    Prompt Canvas
                                </h1>
                                <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Configure your advanced SEO/GEO & Content prompt.</p>
                            </div>

                            {/* Language Selector */}
                            <div>
                                <label className="block text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-1.5">{UI_LABELS.langTitle}</label>
                                <div className="flex flex-wrap gap-1.5">
                                    {['en', 'de', 'fr', 'es', 'pl', 'it'].map((lang) => (
                                        <button
                                            key={lang}
                                            onClick={() => setOutputLang(lang)}
                                            className={`px-3 py-1 rounded-md text-xs font-semibold transition-all ${
                                                outputLang === lang 
                                                ? 'bg-blue-600 text-white shadow-sm' 
                                                : 'bg-white dark:bg-gray-700 text-slate-600 dark:text-gray-200 border border-gray-200 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600'
                                            }`}
                                        >
                                            {lang.toUpperCase()}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Form Fields */}
                            <div className="space-y-2.5">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-200 mb-1">{UI_LABELS.topic}</label>
                                    <input 
                                        type="text" 
                                        name="topic"
                                        value={inputs.topic}
                                        onChange={handleInputChange}
                                        placeholder="e.g. THOR motocross gear"
                                        className="w-full px-2.5 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-200 mb-1">{UI_LABELS.keywords}</label>
                                    <textarea 
                                        name="keywords"
                                        value={inputs.keywords}
                                        onChange={handleInputChange}
                                        placeholder="e.g. MIPS motocross helmet, off-road helmet, impact protection"
                                        className="w-full px-2.5 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all h-14 resize-none"
                                    />
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-200 mb-1">{UI_LABELS.audience}</label>
                                        <input 
                                            type="text" 
                                            name="audience"
                                            value={inputs.audience}
                                            onChange={handleInputChange}
                                            placeholder="e.g. Motocross riders, off-road enthusiasts"
                                            className="w-full px-2.5 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-200 mb-1">{UI_LABELS.competitors}</label>
                                        <input 
                                            type="text" 
                                            name="competitors"
                                            value={inputs.competitors}
                                            onChange={handleInputChange}
                                            placeholder="e.g. Fox Racing, Alpinestars"
                                            className="w-full px-2.5 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none"
                                        />
                                    </div>
                                </div>
                                
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-200 mb-1">{UI_LABELS.tone}</label>
                                    <input 
                                        type="text" 
                                        name="tone"
                                        value={inputs.tone}
                                        onChange={handleInputChange}
                                        className="w-full px-2.5 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>

                                <div>
                                    <label htmlFor="writingFramework" className="block text-xs font-semibold text-slate-700 dark:text-slate-200 mb-1">{PROMPT_TEMPLATES[outputLang].framework_label}</label>
                                    <div className="grid grid-cols-1 sm:grid-cols-[140px_1fr] gap-2.5 items-start">
                                        <select
                                            id="writingFramework"
                                            value={selectedFramework}
                                            onChange={(e) => setSelectedFramework(e.target.value)}
                                            className="w-full px-2.5 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none"
                                        >
                                            {['AIDA', 'PAS', 'BAB', 'AIDAR', 'FAB'].map((framework) => (
                                                <option key={framework} value={framework}>{framework}</option>
                                            ))}
                                        </select>
                                        <div className="rounded-lg border border-gray-200 dark:border-gray-600 bg-white/70 dark:bg-gray-700/70 px-2.5 py-1.5">
                                            <div className="flex flex-wrap gap-x-2.5 gap-y-0.5 text-xs text-slate-700 dark:text-slate-200">
                                                {currentFramework.stages.map(([letter, stage], index) => (
                                                    <span key={`${letter}-${index}`}><strong className="text-blue-700 dark:text-blue-300">{letter}</strong> {stage}</span>
                                                ))}
                                            </div>
                                            <p className="mt-0.5 text-[11px] leading-snug text-slate-500 dark:text-slate-400">{currentFramework.fit}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Toggles */}
                            <div className="bg-slate-50 dark:bg-slate-800 p-3 rounded-xl space-y-2 border border-slate-100 dark:border-slate-700">
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    <label className="flex items-center space-x-2 cursor-pointer">
                                        <input type="checkbox" name="enableGEO" checked={inputs.enableGEO} onChange={handleInputChange} className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 shrink-0" />
                                        <span className="text-xs text-slate-700 dark:text-slate-200 font-medium">{UI_LABELS.geo}</span>
                                    </label>
                                    <label className="flex items-center space-x-2 cursor-pointer">
                                        <input type="checkbox" name="enableMeta" checked={inputs.enableMeta} onChange={handleInputChange} className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 shrink-0" />
                                        <span className="text-xs text-slate-700 dark:text-slate-200 font-medium">{UI_LABELS.meta}</span>
                                    </label>
                                    <label className="flex items-center space-x-2 cursor-pointer">
                                        <input type="checkbox" name="enableSerp" checked={inputs.enableSerp} onChange={handleInputChange} className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 shrink-0" />
                                        <span className="text-xs text-slate-700 dark:text-slate-200 font-medium">{UI_LABELS.serp}</span>
                                    </label>
                                    <label className="flex items-center space-x-2 cursor-pointer">
                                        <input type="checkbox" name="enableSchema" checked={inputs.enableSchema} onChange={handleInputChange} className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 shrink-0" />
                                        <span className="text-xs text-slate-700 dark:text-slate-200 font-medium">{UI_LABELS.schema}</span>
                                    </label>
                                </div>
                                <div className="border-t border-slate-200 dark:border-slate-700 pt-2">
                                    <label className="flex items-center space-x-2 cursor-pointer bg-white dark:bg-slate-700/60 px-2.5 py-2 rounded-lg border border-blue-100 dark:border-blue-800/60 shadow-sm hover:border-blue-300 transition-colors">
                                        <input type="checkbox" name="enableBlog" checked={inputs.enableBlog} onChange={handleInputChange} className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 shrink-0" />
                                        <span className="text-xs sm:text-sm text-blue-900 dark:text-blue-200 font-bold">{UI_LABELS.blog}</span>
                                    </label>
                                </div>
                            </div>

                        </div>

                        {/* RIGHT COLUMN - PREVIEW */}
                        <div className="flex flex-col gap-3">
                             <div className="glass-panel rounded-xl shadow-lg flex flex-col overflow-hidden h-[360px] lg:h-[390px]">
                                <div className="bg-white/95 dark:bg-gray-800/95 px-3.5 py-2.5 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center gap-2 shrink-0">
                                    <span className="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Generated Prompt Preview</span>
                                    <div className="flex items-center gap-2.5">
                                        <div className="flex items-center gap-1.5">
                                            <div className={`w-2 h-2 rounded-full ${inputs.topic ? 'bg-green-500' : 'bg-orange-400 animate-pulse'}`}></div>
                                            <span className="text-[11px] text-slate-400 dark:text-slate-500">{inputs.topic ? 'Ready to copy' : 'Waiting for input...'}</span>
                                        </div>
                                        <button
                                            onClick={copyToClipboard}
                                            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold text-white transition-colors shadow-sm ${
                                                copySuccess ? 'bg-green-500 hover:bg-green-600' : 'bg-blue-600 hover:bg-blue-700'
                                            }`}
                                        >
                                            {copySuccess ? (
                                                <>
                                                    <i className="fa-solid fa-check"></i>
                                                    Copied!
                                                </>
                                            ) : (
                                                <>
                                                    <i className="fa-regular fa-copy"></i>
                                                    {UI_LABELS.copy}
                                                </>
                                            )}
                                        </button>
                                    </div>
                                </div>
                                <div className="flex-1 min-h-0 overflow-y-scroll prompt-scroll p-3.5 bg-white dark:bg-slate-900 text-gray-800 dark:text-gray-300 font-mono text-xs leading-relaxed whitespace-pre-wrap">
                                    {generatedPrompt}
                                </div>
                             </div>
                             
                             {/* Tip Card */}
                             <div className="bg-blue-50 dark:bg-blue-900/40 border border-blue-100 dark:border-blue-800 rounded-xl p-3 flex gap-3 items-start">
                                <div className="bg-blue-100 dark:bg-blue-800 p-1.5 rounded-lg text-blue-600 dark:text-blue-300 text-xs shrink-0">
                                    <i className="fa-solid fa-lightbulb"></i>
                                </div>
                                <div>
                                    <h4 className="font-bold text-blue-900 dark:text-blue-200 text-xs">Pro Tips for GEO & Blogs</h4>
                                    <ul className="text-blue-800 dark:text-blue-300 text-[11px] mt-1 list-disc list-inside space-y-0.5 leading-snug">
                                        <li>Include <strong>LSI Keywords</strong> in the secondary keywords field so the AI writes naturally without keyword stuffing; this boosts GEO ranking.</li>
                                        <li>Be explicit in your tone and audience inputs – clear direction yields more accurate, brand‑aligned content.</li>
                                        <li>When generating schema, choose <code>FAQPage</code> for question‑answer formats; it increases the chance of rich results.</li>
                                        <li>Keep prompts concise but thorough; too much fluff can confuse the model and dilute SEO focus.</li>
                                    </ul>
                                </div>
                             </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
