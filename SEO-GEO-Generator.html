                                    <button 
                                        onClick={copyToClipboard}
                                        className={`flex items-center gap-2 px-6 py-3 rounded-lg font-bold text-white transition-all shadow-lg ${
                                            copySuccess 
                                            ? 'bg-green-500 hover:bg-green-600 translate-y-0' 
                                            : 'bg-blue-600 hover:bg-blue-700 hover:-translate-y-1'
                                        }`}
                                    >
                                        {copySuccess ? (
                                            <>
                                                <i className="fa-solid fa-check"></i>
                                                Copied!
                                            </>
                                        ) : (
                                            <>
                                                <i className="fa-regular fa-copy"></i>
                                                {UI_LABELS.copy}
                                            </>
                                        )}
                                    </button>
                                </div>
                             </div>
                             
                             {/* Tip Card */}
                             <div className="bg-blue-50 dark:bg-blue-900 border border-blue-100 dark:border-blue-800 rounded-xl p-4 flex gap-4 items-start">
                                <div className="bg-blue-100 dark:bg-blue-800 p-2 rounded-lg text-blue-600 dark:text-blue-300">
                                    <i className="fa-solid fa-lightbulb"></i>
                                </div>
                                <div>
                                    <h4 className="font-bold text-blue-900 dark:text-blue-200 text-sm">Pro Tips for GEO & Blogs</h4>
                                    <ul className="text-blue-800 dark:text-blue-300 text-xs mt-1 list-disc list-inside space-y-1">
                                        <li>Include <strong>LSI Keywords</strong> in the secondary keywords field so the AI writes naturally without keyword stuffing; this boosts GEO ranking.</li>
                                        <li>Be explicit in your tone and audience inputs – clear direction yields more accurate, brand‑aligned content.</li>
                                        <li>When generating schema, choose <code>FAQPage</code> for question‑answer formats; it increases the chance of rich results.</li>
                                        <li>Keep prompts concise but thorough; too much fluff can confuse the model and dilute SEO focus.</li>
                                    </ul>
                                </div>
                             </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
